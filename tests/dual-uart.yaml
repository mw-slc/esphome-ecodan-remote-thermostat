# Compile-only Waveshare ESP32-S3-POE-ETH-8DI-8DO fixture. No real credentials.
esphome:
  name: cnrf-coexistence-test
  compile_process_limit: 1
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
logger:
  baud_rate: 0
api:
  reboot_timeout: 0s
ethernet:
  type: W5500
  clk_pin: GPIO15
  mosi_pin: GPIO13
  miso_pin: GPIO14
  cs_pin: GPIO16
  interrupt_pin: GPIO12
  reset_pin: GPIO39
uart:
  - id: uart_hp
    rx_pin: GPIO44
    tx_pin: GPIO43
    baud_rate: 2400
    parity: EVEN
    stop_bits: 1
  - id: uart_cnrf
    rx_pin: GPIO1
    tx_pin: GPIO0
    baud_rate: 2400
    parity: EVEN
    stop_bits: 1
# HP's header requires select even when no select entities are configured.
select: []
external_components:
  - source:
      type: local
      path: ../components
    components: [ecodan_cnrf]
  - source: github://gekkekoe/esphome-ecodan-hp@aae8c4b072621de46acfb75e5d21df4177673637
    components: [ecodan]
ecodan:
  id: hp_instance
  uart_id: uart_hp
ecodan_cnrf:
  id: ecodan_instance
  uart_id: uart_cnrf
packages:
  room0: !include {file: ../confs/thermostat-room.yaml, vars: {room_identifier: 0, room_name: Room0}}
  room1: !include {file: ../confs/thermostat-room.yaml, vars: {room_identifier: 1, room_name: Room1}}
